[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "regen-synthetic"
version = "0.1.0"
description = "Basic generic synthetic table generator: any table, no label column, no declared analysis"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Uzoma Nwaokoro"},
]
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.4",
    "pandas==2.1.4",
    "scipy==1.11.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
synth = "cli.main:main"

[tool.setuptools.packages.find]
include = ["engine*", "contracts*", "cli*", "simulate*", "certify*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
