name: tests

# Runs on Linux, which no development machine here is — the point is to find
# out whether the pinned dependency set actually reproduces off one laptop,
# not to re-confirm that it works where it was written. The test suite
# asserts numeric thresholds on seeded draws, and those are exactly the
# assertions that can shift with a different platform or BLAS build.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false          # report every version, not just the first to break
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Deliberately the same commands the README gives a reader, so a green
      # run means those instructions are known to work, not assumed to.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Tests
        run: pytest tests/ -q

      # The examples are part of what the README promises; a crash in one is a
      # broken promise even when every unit test passes.
      - name: Example — generate the demo table and simulate it
        run: |
          python examples/make_sample_data.py
          synth generate examples/readings.csv --n-rows 500 --out /tmp/ci-out

      - name: Example — the decision check end to end
        run: python examples/decision_check/run_demo.py
